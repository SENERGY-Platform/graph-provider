#
# The release. A push to master builds the image and pushes it, and the tag
# step is what makes the release namable: rancher-2-defs pins a version, not
# :prod, so without a tag there is nothing for a deployment to point at.
#
# The gates run first, as a job of this run rather than a workflow beside it.
# That ordering is the point: no tag exists and no image is pushed unless every
# gate passed on this exact commit. A red gate then leaves nothing behind to
# roll back - which is also why gates.yml has no push trigger of its own.
#
# The tag is pushed with GITHUB_TOKEN, and a push made with that token does not
# trigger workflows - which is why the tags filter below cannot loop.
name: 'PROD Docker Image'

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Waits for every job in gates.yml, the integration suite included. That one
  # is the only suite talking to a real device-repository and a real
  # permissions-v2, so it is worth the wait before an image goes out; a called
  # workflow is depended on whole, single jobs of it cannot be picked out.
  gates:
    uses: ./.github/workflows/gates.yml

  # The tagging step. Conventional-commit subjects decide the bump, so a
  # feat: moves the minor and everything else the patch. It is a job of its own
  # and needs the gates, so a red gate still leaves no tag.
  version:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  #
  # VERSION is handed in rather than read from git: the builder's Git context carries
  # no tags, and the tag this run creates does not exist in it at all. Without it
  # GET /info reports "dev" for every image ever built.
  multi:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      build-args: |
        VERSION=${{ needs.version.outputs.tag }}
      meta-images: |
        smartenergyplatform/graph-provider
        ghcr.io/senergy-platform/graph-provider
      meta-tags: |
        type=raw,value=prod
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=latest
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
