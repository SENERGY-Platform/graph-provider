#
# The release. A push to master builds the image and pushes it, and the tag
# step is what makes the release namable: rancher-2-defs pins a version, not
# :prod, so without a tag there is nothing for a deployment to point at.
#
# The gates run first, as a job of this run rather than a workflow beside it.
# That ordering is the point: no tag exists and no image is pushed unless every
# gate passed on this exact commit. A red gate then leaves nothing behind to
# roll back - which is also why gates.yml has no push trigger of its own.
#
# The tag is pushed with GITHUB_TOKEN, and a push made with that token does not
# trigger workflows - which is why the tags filter below cannot loop.
name: 'PROD Docker Image'

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  # Waits for every job in gates.yml, the integration suite included. That one
  # is the only suite talking to a real device-repository and a real
  # permissions-v2, so it is worth the wait before an image goes out; a called
  # workflow is depended on whole, single jobs of it cannot be picked out.
  gates:
    uses: ./.github/workflows/gates.yml

  multi:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      # The tagging step. Conventional-commit subjects decide the bump, so a
      # feat: moves the minor and everything else the patch.
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # VERSION is handed in rather than read from git: the checkout above is
      # shallow and carries no tags, and the tag this run creates does not
      # exist in that working copy at all. Without it GET /info reports "dev"
      # for every image ever built.
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tag_version.outputs.new_tag }}
          tags: |
            smartenergyplatform/graph-provider:prod
            ghcr.io/senergy-platform/graph-provider:prod
            smartenergyplatform/graph-provider:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/senergy-platform/graph-provider:${{ steps.tag_version.outputs.new_tag }}
            smartenergyplatform/graph-provider:latest
            ghcr.io/senergy-platform/graph-provider:latest
